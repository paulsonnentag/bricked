<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Vehicle physics prototype</title>
<link rel="icon" href="data:," />
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(14, 17, 23, 0.72);
    --stroke: rgba(255, 255, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0e1117;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #e8ecf3;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }

  #hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    margin: 0;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    white-space: pre;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }

  @media (max-width: 520px) {
    #hud { font-size: 10px; padding: 8px 10px; }
  }

  #help {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.6;
    color: #aab3c0;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    pointer-events: none;
  }
  #help.hidden { display: none; }

  #loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: #aab3c0;
    background: #0e1117;
    z-index: 20;
  }
  #loading.hidden { display: none; }

  /* ---- touch controls ---- */
  #touch-controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    display: none;
    touch-action: none;
  }
  #touch-controls.visible { display: block; }

  #steer-pad {
    position: absolute;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    width: min(46vw, 260px);
    height: 108px;
    border-radius: 54px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    pointer-events: auto;
    touch-action: none;
  }
  #steer-pad::after {
    content: '◀   steer   ▶';
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 11px;
    color: #7f8a99;
    pointer-events: none;
  }
  #steer-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 68px;
    height: 68px;
    margin: 0;
    border-radius: 50%;
    background: rgba(232, 80, 58, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.35);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .touch-btn {
    position: absolute;
    display: grid;
    place-items: center;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: 50%;
    color: #e8ecf3;
    font-size: 13px;
    pointer-events: auto;
    touch-action: none;
  }
  .touch-btn.pressed { background: rgba(232, 80, 58, 0.55); }

  #btn-throttle {
    right: max(16px, env(safe-area-inset-right));
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px);
    width: 92px;
    height: 92px;
  }
  #btn-brake {
    right: calc(max(16px, env(safe-area-inset-right)) + 100px);
    bottom: max(16px, env(safe-area-inset-bottom));
    width: 82px;
    height: 82px;
  }
  #btn-handbrake {
    right: max(16px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    width: 82px;
    height: 82px;
    font-size: 11px;
  }
  /* Kept on the left, clear of the tuning panel. */
  #btn-reset {
    left: max(12px, env(safe-area-inset-left));
    top: calc(max(12px, env(safe-area-inset-top)) + 128px);
    width: 56px;
    height: 56px;
    font-size: 11px;
  }
  #btn-camera {
    left: calc(max(12px, env(safe-area-inset-left)) + 64px);
    top: calc(max(12px, env(safe-area-inset-top)) + 128px);
    width: 56px;
    height: 56px;
    font-size: 11px;
  }
</style>

<pre id="hud"></pre>
<div id="help">WASD / arrows &nbsp;drive &nbsp;·&nbsp; space &nbsp;handbrake &nbsp;·&nbsp; R &nbsp;reset &nbsp;·&nbsp; C &nbsp;camera</div>
<div id="loading">loading physics…</div>

<div id="touch-controls">
  <div id="steer-pad"><div id="steer-knob"></div></div>
  <div class="touch-btn" id="btn-throttle" data-touch-action="throttle">GAS</div>
  <div class="touch-btn" id="btn-brake" data-touch-action="brake">BRAKE</div>
  <div class="touch-btn" id="btn-handbrake" data-touch-action="handbrake">HAND<br />BRAKE</div>
  <div class="touch-btn" id="btn-reset" data-touch-action="reset">RESET</div>
  <div class="touch-btn" id="btn-camera" data-touch-action="camera">CAM</div>
</div>

<script type="module" src="/src/main.ts"></script>
